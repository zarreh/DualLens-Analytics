[tool.poetry]
name = "duallens-analytics"
version = "0.1.0"
description = "RAG-powered investment analysis combining financial metrics with AI initiative insights"
authors = ["Alireza"]
readme = "README.md"
packages = [{include = "duallens_analytics", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
streamlit = "^1.45"
langchain = "^0.3"
langchain-core = "^0.3"
langchain-openai = "^0.3"
langchain-community = "^0.3"
chromadb = "^1.0"
pypdf = "^5.0"
yfinance = "^0.2"
plotly = "^6.0"
pandas = "^2.0"
python-dotenv = "^1.1"
tiktoken = "^0.9"
omegaconf = "^2.3"
hydra-core = "^1.3"
tabulate = "^0.9.0"
langchain-chroma = ">=0.1,<1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^6.0"
ruff = "^0.11"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.6"
mkdocstrings = {extras = ["python"], version = "^0.29"}
mkdocs-gen-files = "^0.5"
mkdocs-literate-nav = "^0.6"

[tool.poetry.scripts]
duallens = "duallens_analytics.app:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ── Ruff ────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["duallens_analytics"]

# ── Pytest ──────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests that hit external APIs",
]
