# ──────────────────────────────────────────────────────────────
# DualLens Analytics – Docker Compose
# ──────────────────────────────────────────────────────────────
# Usage:
#   cp .env.example .env          # fill in API_KEY
#   docker compose up -d          # start
#   docker compose logs -f app    # tail logs
#   docker compose down           # stop
# ──────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duallens-analytics
    restart: unless-stopped
    ports:
      - "127.0.0.1:8510:8510"
    env_file:
      - .env
    volumes:
      # Persist ChromaDB + extracted PDFs across container restarts
      - duallens-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8510/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  duallens-data:
